<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안녕하세요</title>
<style>
  :root {
    --bg: #eef3f1;
    --fg: #1d2b27;
    --sub: #55665f;
    --accent: #2f6f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201c;
      --fg: #e8f0ec;
      --sub: #9fb3aa;
      --accent: #7cc4ad;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(3rem, 14vw, 7rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    margin: 0 0 12px;
    color: var(--accent);
  }
  p {
    margin: 0;
    font-size: 1.125rem;
    color: var(--sub);
  }
</style>
</head>
<body>
  <main>
    <h1>안녕하세요</h1>
    <p>Hello, World! 만나서 반갑습니다.</p>
  </main>
</body>
</html>
